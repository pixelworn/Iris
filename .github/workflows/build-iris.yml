name: Build Iris
 
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        default: plugin
        options:
          - plugin   # one jar for Paper, Purpur, Leaf, Canvas, Folia and Spigot
          - mods     # Fabric, Forge and NeoForge jars
          - all
 
permissions:
  contents: read
 
jobs:
  plugin:
    if: inputs.target == 'plugin' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the plugin jar
        run: >
          ./gradlew buildSwiftSwamp -x :core:test
          --no-daemon --no-parallel --max-workers=1
          "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
          "-PbuildsDirectory=${{ github.workspace }}/out"
          --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: iris-plugin
          if-no-files-found: error
          path: out/Iris.jarr
 
  mods:
    if: inputs.target == 'mods' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod jars
        run: ./gradlew buildFabric buildForge buildNeoforge --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: iris-mods
          if-no-files-found: error
          path: |
            adapters/*/build/**/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
            
